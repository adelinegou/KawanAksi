<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Kawan Aksi</title>

  <link rel="stylesheet" href="style.css">
  <script type="module" src="auth.js" defer></script>
</head>
<body>

<div class="form-container">

  <h1>Login</h1>
  <p>Masuk ke akun Kawan Aksi</p>

  <form id="loginForm">

    <input
      type="email"
      id="loginEmail"
      placeholder="Email"
      required
    >

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
      required
    >

    <button type="submit">
      Login
    </button>

  </form>

  <p id="loginStatus" class="form-status"></p>

  <p style="text-align:center; margin-top:20px;">
    Belum punya akun?
    <a href="signup.html">Daftar di sini</a>
  </p>

</div>

</body>
</html>
