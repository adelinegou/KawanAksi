<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register Event - Kawan Aksi</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js" defer></script>
</head>
<body>

<a href="index.html" class="back-btn">← Kembali</a>

<div class="form-container">
  <h1>Daftarkan Kegiatan Baru</h1>

  <form id="eventRegisterForm">
    <p class="input-hint">Nama penyelenggara dan kontak akan dimuat otomatis dari profil Anda jika tersedia.</p>
    <input type="text" id="evTitle" placeholder="Nama Acara" minlength="3" required>
    <input type="text" id="evLocation" placeholder="Lokasi" minlength="3" required>
    <input type="date" id="evDate" required>
    <div class="time-row">
      <label class="field-label">
        Waktu Mulai
        <input type="time" id="evStartTime" required>
      </label>
      <label class="field-label">
        Waktu Selesai
        <input type="time" id="evEndTime" required>
      </label>
    </div>
    <input type="text" id="evOrganizer" placeholder="Nama Penyelenggara" minlength="3" required>
    <input
      type="tel"
      id="evContact"
      placeholder="Nomor Kontak WhatsApp (+62812...)"
      autocomplete="tel"
      inputmode="tel"
      pattern="\+628[1-9][0-9]{7,11}"
      title="Gunakan format +62, contoh +6281234567890."
      required
    >
    <label class="field-label">
      Gambar Kegiatan
      <input type="file" id="evImage" accept="image/jpeg,image/png,image/webp" required>
    </label>
    <img id="evImagePreview" class="image-preview" alt="Preview gambar kegiatan" hidden>
    <textarea id="evDescription" placeholder="Deskripsi Acara" required></textarea>
    <textarea id="evRequirements" placeholder="Persyaratan (pisahkan dengan baris baru)" required></textarea>
    <textarea id="evBenefits" placeholder="Benefit (pisahkan dengan baris baru)" required></textarea>

    <button class="btn-primary" type="submit">Submit</button>
  </form>

  <p id="eventSubmitStatus"></p>
</div>

</body>
</html>
